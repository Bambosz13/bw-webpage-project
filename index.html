<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RWD + SPA Projekt</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Moje SPA</h1>
        <nav>
            <a href="#home" class="nav-link" data-target="home">Start</a>
            <a href="#dashboard" class="nav-link" data-target="dashboard">Panel</a>
            <a href="#contact" class="nav-link" data-target="contact">Kontakt</a>
        </nav>
    </header>

    <main>
        <section id="home" class="page active">
            <h2>Strona Główna</h2>
            <p>To jest przykładowy tekst. Layout dostosowuje się do szerokości ekranu.</p>
            
            <div class="grid-container">
                <div class="box">Moduł 1</div>
                <div class="box">Moduł 2</div>
                <div class="box">Moduł 3</div>
                <div class="box">Moduł 4</div>
            </div>
        </section>

        <section id="dashboard" class="page">
            <h2>Panel analityczny</h2>
            <p>Treść drugiego widoku. Zawartość wczytana bez odświeżania przeglądarki.</p>
        </section>

        <section id="contact" class="page">
            <h2>Kontakt</h2>
            <p>Tutaj znajdowałby się formularz kontaktowy.</p>
        </section>
    </main>

    <script src="app.js"></script>
</body>
</html>
